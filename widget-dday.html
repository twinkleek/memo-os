<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEMO OS · D-day</title>
<style>
  :root {
    --pink-text: #dc7494;
    --pink-soft: #fce0e9;
    --pink-light: #fef0f5;
    --pink-mid: #fcd0de;
    --pink-accent: #f599b3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 10px;
    font-family: -apple-system, 'Pretendard', system-ui, sans-serif;
  }
  .dday-card {
    width: 100%;
    max-width: 270px;
    background: #ffffff;
    border: 1.5px solid var(--pink-mid);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(252, 208, 222, 0.25);
  }
  .dday-topbar {
    background: var(--pink-light);
    padding: 6px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--pink-soft);
    font-size: 11px;
  }
  .dday-title {
    color: var(--pink-text);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .dday-ctrl {
    display: flex;
    gap: 6px;
    color: #d8b8c4;
    font-size: 10px;
  }
  .dday-list {
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .dday-item {
    background: var(--pink-light);
    border-radius: 8px;
    padding: 6px 9px;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: #5a4a52;
  }
  .dday-badge {
    background: #ffffff;
    color: var(--pink-text);
    font-weight: 700;
    border-radius: 5px;
    padding: 3px 6px;
    font-size: 9px;
    min-width: 32px;
    text-align: center;
    letter-spacing: 0.04em;
    border: 1px solid var(--pink-mid);
  }
  .dday-badge.urgent { background: var(--pink-accent); color: #ffffff; border-color: var(--pink-accent); }
  .dot { color: var(--pink-accent); font-size: 7px; }
  .dday-foot {
    border-top: 1px solid var(--pink-soft);
    text-align: center;
    padding: 4px 0;
    color: #d8b8c4;
    font-size: 10px;
  }
</style>
</head>
<body>
  <div class="dday-card">
    <div class="dday-topbar">
      <span class="dday-title">💕 Upcoming Events</span>
      <span class="dday-ctrl">↻ ⌄</span>
    </div>
    <div class="dday-list" id="list"></div>
    <div class="dday-foot">⌄</div>
  </div>
<script>
const KEY = 'memoos_dday';
function load(){
  try { return JSON.parse(localStorage.getItem(KEY)) || seed(); }
  catch(e) { return seed(); }
}
function save(items){ localStorage.setItem(KEY, JSON.stringify(items)); }
function seed(){
  const today = new Date();
  const t = (d) => { const n = new Date(today); n.setDate(n.getDate()+d); return n.toISOString().split('T')[0]; };
  return [
    { title: '수익 마감', date: t(7) },
  ];
}
function calcDay(dateStr){
  const target = new Date(dateStr);
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.ceil((target - today) / 86400000);
}
function render(){
  const items = load();
  const list = document.getElementById('list');
  list.innerHTML = '';
  items.sort((a,b) => new Date(a.date) - new Date(b.date));
  items.forEach((it) => {
    const d = calcDay(it.date);
    let label, badgeClass = '';
    if (d === 0) { label = 'D-day'; badgeClass = 'urgent'; }
    else if (d > 0) { label = 'D-' + d; if (d <= 3) badgeClass = 'urgent'; }
    else { label = 'D+' + Math.abs(d); }
    const row = document.createElement('div');
    row.className = 'dday-item';
    row.innerHTML = `<span class="dday-badge ${badgeClass}">${label}</span><span class="dot">●</span><span>${esc(it.title)}</span>`;
    list.appendChild(row);
  });
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
render();
</script>
</body>
</html>
