<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEMO OS · To-do</title>
<style>
  :root {
    --pink-text: #dc7494;
    --pink-soft: #fce0e9;
    --pink-light: #fef0f5;
    --pink-mid: #fcd0de;
    --pink-accent: #f599b3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 10px;
    font-family: -apple-system, 'Pretendard', system-ui, sans-serif;
  }
  .todo-card {
    width: 100%;
    max-width: 270px;
    background: #ffffff;
    border: 1.5px solid var(--pink-mid);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(252, 208, 222, 0.25);
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 20px);
  }
  .todo-topbar {
    background: var(--pink-light);
    padding: 6px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--pink-soft);
    font-size: 11px;
  }
  .todo-title {
    color: var(--pink-text);
    font-weight: 700;
  }
  .todo-dots {
    display: flex;
    gap: 3px;
  }
  .todo-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--pink-mid);
  }
  .todo-input {
    display: flex;
    padding: 6px 8px;
    gap: 5px;
    border-bottom: 1px solid var(--pink-soft);
    background: #ffffff;
  }
  .todo-input input {
    flex: 1;
    background: var(--pink-light);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 11px;
    color: #5a4a52;
    border: none;
    outline: none;
    font-family: inherit;
  }
  .todo-input input::placeholder { color: #d8b8c4; }
  .todo-input button {
    background: #ffffff;
    color: var(--pink-text);
    border: 1px solid var(--pink-mid);
    border-radius: 5px;
    width: 22px;
    height: 22px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    line-height: 1;
  }
  .todo-input button:hover { background: var(--pink-mid); color: #ffffff; }
  .todo-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    background: #ffffff;
  }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px;
    font-size: 11px;
    color: #5a4a52;
    border-bottom: 1px solid var(--pink-light);
    transition: background 0.1s;
  }
  .todo-item:hover { background: var(--pink-light); }
  .todo-item:last-child { border: none; }
  .todo-item input[type="checkbox"] {
    appearance: none;
    width: 11px;
    height: 11px;
    border: 1.3px solid var(--pink-mid);
    border-radius: 2px;
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
    margin: 0;
  }
  .todo-item input[type="checkbox"]:checked {
    background: var(--pink-mid);
    border-color: var(--pink-mid);
  }
  .todo-item input[type="checkbox"]:checked::after {
    content: '✓';
    position: absolute;
    color: #ffffff;
    font-size: 8px;
    font-weight: 700;
    top: -3px;
    left: 1px;
  }
  .todo-item.done .text { text-decoration: line-through; color: #d8b8c4; }
  .todo-item .text { flex: 1; line-height: 1.3; }
  .todo-heart { color: var(--pink-mid); font-size: 9px; cursor: pointer; opacity: 0.5; transition: all 0.15s; }
  .todo-heart.active { opacity: 1; color: var(--pink-accent); }
  .todo-caret { color: #d8b8c4; font-size: 9px; cursor: pointer; }
  .todo-item .del {
    color: #d8b8c4;
    font-size: 11px;
    cursor: pointer;
    opacity: 0;
    transition: all 0.15s;
  }
  .todo-item:hover .del { opacity: 1; }
</style>
</head>
<body>
  <div class="todo-card">
    <div class="todo-topbar">
      <span class="todo-title">📝 to do list</span>
      <span class="todo-dots"><span></span><span></span><span></span></span>
    </div>
    <div class="todo-input">
      <input id="inp" placeholder="할 일 추가..." onkeydown="if(event.key==='Enter')add()">
      <button onclick="add()">+</button>
    </div>
    <div class="todo-list" id="list"></div>
  </div>
<script>
const KEY = 'memoos_todo';
function load(){
  try { return JSON.parse(localStorage.getItem(KEY)) || seed(); }
  catch(e) { return seed(); }
}
function save(arr){ localStorage.setItem(KEY, JSON.stringify(arr)); }
function seed(){ return [
  {t:'SNS 사진 업로드', d:false, h:false},
];}
function render(){
  const items = load();
  const list = document.getElementById('list');
  list.innerHTML = '';
  items.forEach((it, i) => {
    const row = document.createElement('div');
    row.className = 'todo-item' + (it.d ? ' done' : '');
    row.innerHTML = `<input type="checkbox" ${it.d?'checked':''}><span class="text">${esc(it.t)}</span><span class="todo-heart${it.h?' active':''}">♡</span><span class="todo-caret">⌄</span><span class="del">×</span>`;
    row.querySelector('input').onchange = (e) => { const arr = load(); arr[i].d = e.target.checked; save(arr); render(); };
    row.querySelector('.todo-heart').onclick = () => { const arr = load(); arr[i].h = !arr[i].h; save(arr); render(); };
    row.querySelector('.del').onclick = () => { const arr = load(); arr.splice(i, 1); save(arr); render(); };
    list.appendChild(row);
  });
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function add(){
  const inp = document.getElementById('inp');
  if(!inp.value.trim()) return;
  const arr = load();
  arr.push({t: inp.value.trim(), d: false, h: false});
  save(arr);
  inp.value = '';
  render();
}
render();
</script>
</body>
</html>
