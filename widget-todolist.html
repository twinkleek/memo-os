<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEMO OS · To-do</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 8px;
    background: transparent;
  }
  .todo-card {
    width: 100%;
    max-width: 320px;
    height: calc(100vh - 16px);
    max-height: 480px;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #fffafc, #fef0f5);
    border: 1px solid #fce0e9;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(255, 143, 171, 0.14);
  }
  .todo-header {
    background: var(--pink-100);
    padding: 8px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #fce0e9;
  }
  .todo-title {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 12px;
    color: var(--pink-text);
    font-weight: 600;
  }
  .todo-input {
    display: flex;
    padding: 8px 10px;
    gap: 6px;
    background: #ffffff;
    border-bottom: 1px solid #fef0f5;
  }
  .todo-input input {
    flex: 1;
    background: var(--pink-100);
    border-radius: 10px;
    padding: 7px 12px;
    font-size: 12px;
    color: var(--text);
  }
  .todo-input button {
    background: #fcd0de;
    color: #ffffff;
    border-radius: 8px;
    width: 28px;
    height: 28px;
    font-size: 15px;
    font-weight: 700;
  }
  .todo-input button:hover { background: #f599b3; }
  .todo-list {
    padding: 6px 0;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    background: #ffffff;
  }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 14px;
    font-size: 12px;
    color: var(--text);
    border-bottom: 1px solid #fef0f5;
    transition: background 0.1s;
  }
  .todo-item:hover { background: #fffafc; }
  .todo-item:last-child { border: none; }
  .todo-item input[type="checkbox"] {
    appearance: none;
    width: 14px;
    height: 14px;
    border: 1.5px solid #fcd0de;
    border-radius: 4px;
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
  }
  .todo-item input[type="checkbox"]:checked {
    background: #fcd0de;
    border-color: #fcd0de;
  }
  .todo-item input[type="checkbox"]:checked::after {
    content: '✓';
    position: absolute;
    color: #ffffff;
    font-size: 10px;
    font-weight: 700;
    top: -2px;
    left: 2px;
  }
  .todo-item.done .text { text-decoration: line-through; color: var(--text-soft); }
  .todo-item .text { flex: 1; line-height: 1.4; }
  .todo-heart { color: var(--pink-300); font-size: 10px; cursor: pointer; opacity: 0.5; transition: all 0.15s; }
  .todo-heart.active { opacity: 1; color: #f599b3; }
  .todo-heart:hover { transform: scale(1.2); }
  .todo-item .del {
    color: var(--text-soft);
    font-size: 11px;
    cursor: pointer;
    opacity: 0;
    transition: all 0.15s;
  }
  .todo-item:hover .del { opacity: 1; }
  .todo-item .del:hover { color: #f599b3; }
</style>
</head>
<body>
  <div class="todo-card">
    <div class="todo-header">
      <span class="todo-title">📋 to do list</span>
      <span class="win-dots"><span></span><span></span><span></span></span>
    </div>
    <div class="todo-input">
      <input id="inp" placeholder="할 일 추가..." onkeydown="if(event.key==='Enter')add()">
      <button onclick="add()">+</button>
    </div>
    <div class="todo-list" id="list"></div>
  </div>
<script>
const KEY = 'memoos_todo';
function load(){
  try { return JSON.parse(localStorage.getItem(KEY)) || seed(); }
  catch(e) { return seed(); }
}
function save(arr){ localStorage.setItem(KEY, JSON.stringify(arr)); }
function seed(){ return [
  {t:'SNS 사진 업로드', d:false, h:false},
  {t:'다이어트 식단 인증', d:false, h:true},
  {t:'줌인스킨 채널 분석', d:true, h:false},
  {t:'엠타트업 강의 편집', d:false, h:false},
];}
function render(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  load().forEach((it, i) => {
    const row = document.createElement('div');
    row.className = 'todo-item' + (it.d ? ' done' : '');
    row.innerHTML = `<input type="checkbox" ${it.d?'checked':''}><span class="text">${esc(it.t)}</span><span class="todo-heart${it.h?' active':''}" title="중요">♡</span><span class="del" title="삭제">×</span>`;
    row.querySelector('input').onchange = (e) => { const arr = load(); arr[i].d = e.target.checked; save(arr); render(); };
    row.querySelector('.todo-heart').onclick = () => { const arr = load(); arr[i].h = !arr[i].h; save(arr); render(); };
    row.querySelector('.del').onclick = () => { const arr = load(); arr.splice(i, 1); save(arr); render(); };
    list.appendChild(row);
  });
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function add(){
  const inp = document.getElementById('inp');
  if(!inp.value.trim()) return;
  const arr = load();
  arr.push({t: inp.value.trim(), d: false, h: false});
  save(arr);
  inp.value = '';
  render();
}
render();
</script>
</body>
</html>
