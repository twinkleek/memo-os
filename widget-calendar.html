<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEMO OS · Calendar</title>
<link rel="stylesheet" href="styles.css">
<style>
  body {
    display: flex;
    justify-content: center;
    padding: 14px;
    background: transparent;
  }
  .cal-card {
    width: 100%;
    max-width: 290px;
    background: linear-gradient(180deg, #fffafc, #fef0f5);
    border: 1px solid #fce0e9;
    border-radius: 18px;
    padding: 14px 16px 14px;
    box-shadow: 0 6px 18px rgba(255, 143, 171, 0.14);
  }
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .cal-header .label {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 12px;
    color: var(--pink-text);
    font-weight: 600;
  }
  .cal-title {
    text-align: center;
    font-weight: 700;
    font-size: 17px;
    color: var(--text);
    margin: 6px 0 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-family: var(--font-serif);
  }
  .cal-nav {
    cursor: pointer;
    color: #fcd0de;
    font-size: 13px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color 0.15s;
  }
  .cal-nav:hover { color: var(--pink-text); }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    font-size: 11px;
    text-align: center;
  }
  .cal-grid .dow {
    color: var(--pink-text);
    font-weight: 700;
    padding: 6px 0 8px;
    font-size: 9px;
    font-family: var(--font-serif);
    letter-spacing: 0.05em;
  }
  .cal-grid .day {
    padding: 6px 0;
    color: var(--text);
    border-radius: 50%;
    cursor: default;
    width: 28px;
    height: 28px;
    line-height: 16px;
    margin: 0 auto;
  }
  .cal-grid .other { color: var(--text-soft); }
  .cal-grid .today {
    background: #fcd0de;
    color: #ffffff;
    font-weight: 700;
    box-shadow: 0 2px 6px rgba(252, 208, 222, 0.5);
  }
  .cal-grid .sat { color: #87a8d8; }
  .cal-grid .sun { color: #e8849b; }
  .cal-grid .other.sat { color: #c5d4e8; }
  .cal-grid .other.sun { color: #efc9d2; }
  .cal-footer {
    text-align: center;
    margin-top: 12px;
    font-size: 9px;
    color: var(--text-soft);
    font-style: italic;
    letter-spacing: 0.06em;
    padding-top: 6px;
    border-top: 1px dashed #fce0e9;
  }
</style>
</head>
<body>
  <div class="cal-card">
    <div class="cal-header">
      <span class="label">📅 calendar</span>
      <span class="win-dots"><span></span><span></span><span></span></span>
    </div>
    <div class="cal-title">
      <span class="cal-nav" onclick="navMonth(-1)">‹</span>
      <span id="title">2026.05</span>
      <span class="cal-nav" onclick="navMonth(1)">›</span>
    </div>
    <div class="cal-grid" id="grid"></div>
    <div class="cal-footer">⋆⁺₊ ⋆ SOMLUTION ⋆⁺₊ ⋆</div>
  </div>
<script>
const DOW = ['Mo','Tu','We','Th','Fr','Sa','Su'];
let view = new Date();
function render(){
  const y = view.getFullYear();
  const m = view.getMonth();
  document.getElementById('title').textContent = y + '.' + String(m+1).padStart(2,'0');
  const today = new Date();
  const startDow = (new Date(y, m, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  DOW.forEach(d => {
    const el = document.createElement('div');
    el.className = 'dow';
    el.textContent = d;
    grid.appendChild(el);
  });
  for (let i = startDow - 1; i >= 0; i--) {
    const el = document.createElement('div');
    el.className = 'day other';
    if ((i % 7) === 5) el.classList.add('sat');
    if ((i % 7) === 6) el.classList.add('sun');
    el.textContent = prevDays - i;
    grid.appendChild(el);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const el = document.createElement('div');
    el.className = 'day';
    const dow = (new Date(y, m, d).getDay() + 6) % 7;
    if (dow === 5) el.classList.add('sat');
    if (dow === 6) el.classList.add('sun');
    if (today.getFullYear() === y && today.getMonth() === m && today.getDate() === d) {
      el.classList.add('today');
    }
    el.textContent = d;
    grid.appendChild(el);
  }
  let trailing = 7 - ((startDow + daysInMonth) % 7);
  if (trailing === 7) trailing = 0;
  for (let i = 1; i <= trailing; i++) {
    const el = document.createElement('div');
    el.className = 'day other';
    const dow = (startDow + daysInMonth + i - 1) % 7;
    if (dow === 5) el.classList.add('sat');
    if (dow === 6) el.classList.add('sun');
    el.textContent = i;
    grid.appendChild(el);
  }
}
function navMonth(d){
  view = new Date(view.getFullYear(), view.getMonth() + d, 1);
  render();
}
render();
</script>
</body>
</html>
