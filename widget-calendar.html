<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEMO OS · Calendar</title>
<style>
  :root {
    --pink-text: #dc7494;
    --pink-soft: #fce0e9;
    --pink-light: #fef0f5;
    --pink-mid: #fcd0de;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 10px;
    font-family: -apple-system, 'Pretendard', system-ui, sans-serif;
  }
  .cal-card {
    width: 100%;
    max-width: 270px;
    background: #ffffff;
    border: 1.5px solid var(--pink-mid);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(252, 208, 222, 0.25);
  }
  .cal-topbar {
    background: var(--pink-light);
    padding: 6px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--pink-soft);
    font-size: 10px;
  }
  .cal-topbar .label {
    color: var(--pink-text);
    font-weight: 600;
    font-style: italic;
    font-family: Georgia, serif;
  }
  .cal-topbar .ctrl {
    display: flex;
    gap: 7px;
    color: #d8b8c4;
  }
  .cal-body { padding: 8px 10px 10px; }
  .cal-title {
    text-align: center;
    font-weight: 600;
    font-size: 14px;
    color: #5a4a52;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-family: Georgia, serif;
  }
  .cal-nav {
    cursor: pointer;
    color: var(--pink-mid);
    font-size: 14px;
    padding: 0 4px;
  }
  .cal-nav:hover { color: var(--pink-text); }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0;
    font-size: 10px;
    text-align: center;
  }
  .cal-grid .dow {
    color: var(--pink-text);
    font-weight: 700;
    padding: 4px 0 6px;
    font-size: 9px;
    font-family: Georgia, serif;
    letter-spacing: 0;
  }
  .cal-grid .day {
    padding: 4px 0;
    color: #5a4a52;
    cursor: default;
    line-height: 1.3;
    position: relative;
    font-size: 10.5px;
  }
  .cal-grid .other { color: #d8c0c9; }
  .cal-grid .past { color: #c8b3bc; text-decoration: line-through; text-decoration-color: #e8d0d8; }
  .cal-grid .today {
    position: relative;
    color: #ffffff;
    font-weight: 700;
  }
  .cal-grid .today::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 18px;
    height: 18px;
    background: #f599b3;
    border-radius: 50%;
    z-index: -1;
  }
  .cal-grid .today { z-index: 1; }
  .cal-grid .day-wrap {
    position: relative;
    display: inline-block;
    width: 100%;
  }
  .cal-grid .sat { color: #87a8d8; }
  .cal-grid .sun { color: #e8849b; }
  .cal-grid .other.sat { color: #c5d4e8; }
  .cal-grid .other.sun { color: #efc9d2; }
  .cal-grid .past.sat { color: #c5d4e8; }
  .cal-grid .past.sun { color: #efc9d2; }
  .cal-footer {
    text-align: center;
    padding: 8px 0 4px;
    font-size: 8px;
    color: #c8b3bc;
    letter-spacing: 0.15em;
    font-family: Georgia, serif;
    font-style: italic;
  }
</style>
</head>
<body>
  <div class="cal-card">
    <div class="cal-topbar">
      <span class="label">📅 calendar</span>
      <span class="ctrl">⤡ — ▢ ×</span>
    </div>
    <div class="cal-body">
      <div class="cal-title">
        <span class="cal-nav" onclick="navMonth(-1)">‹</span>
        <span id="title">2026.05</span>
        <span class="cal-nav" onclick="navMonth(1)">›</span>
      </div>
      <div class="cal-grid" id="grid"></div>
      <div class="cal-footer">SOMLUTION ♡</div>
    </div>
  </div>
<script>
const DOW = ['Mo','Tu','We','Th','Fr','Sa','Su'];
let view = new Date();
function render(){
  const y = view.getFullYear();
  const m = view.getMonth();
  document.getElementById('title').textContent = y + '.' + String(m+1).padStart(2,'0');
  const today = new Date(); today.setHours(0,0,0,0);
  const isCurrentMonth = today.getFullYear() === y && today.getMonth() === m;
  const startDow = (new Date(y, m, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  DOW.forEach(d => {
    const el = document.createElement('div');
    el.className = 'dow';
    el.textContent = d;
    grid.appendChild(el);
  });
  for (let i = startDow - 1; i >= 0; i--) {
    const el = document.createElement('div');
    el.className = 'day other';
    if ((i % 7) === 5) el.classList.add('sat');
    if ((i % 7) === 6) el.classList.add('sun');
    el.textContent = prevDays - i;
    grid.appendChild(el);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const cellDate = new Date(y, m, d);
    const el = document.createElement('div');
    el.className = 'day';
    const dow = (cellDate.getDay() + 6) % 7;
    if (dow === 5) el.classList.add('sat');
    if (dow === 6) el.classList.add('sun');
    if (isCurrentMonth && today.getDate() === d) {
      el.classList.add('today');
    } else if (cellDate < today) {
      el.classList.add('past');
    }
    el.textContent = d;
    grid.appendChild(el);
  }
  let trailing = 7 - ((startDow + daysInMonth) % 7);
  if (trailing === 7) trailing = 0;
  for (let i = 1; i <= trailing; i++) {
    const el = document.createElement('div');
    el.className = 'day other';
    const dow = (startDow + daysInMonth + i - 1) % 7;
    if (dow === 5) el.classList.add('sat');
    if (dow === 6) el.classList.add('sun');
    el.textContent = i;
    grid.appendChild(el);
  }
}
function navMonth(d){
  view = new Date(view.getFullYear(), view.getMonth() + d, 1);
  render();
}
render();
</script>
</body>
</html>
