<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEMO OS · Chat</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: transparent;
    padding: 8px;
    display: flex;
    justify-content: center;
  }
  .chat-widget {
    width: 100%;
    max-width: 680px;
    height: calc(100vh - 16px);
    max-height: 600px;
    background: linear-gradient(180deg, #fffafc, #fef0f5);
    border: 1px solid #fce0e9;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 22px rgba(255, 143, 171, 0.16);
    display: flex;
    flex-direction: column;
  }
  .chat-topbar {
    background: var(--pink-100);
    padding: 8px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #fce0e9;
  }
  .chat-tabs {
    display: flex;
    gap: 12px;
    font-size: 10px;
    color: var(--text-light);
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .chat-tabs .tab {
    cursor: pointer;
    padding: 3px 9px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
  }
  .chat-tabs .tab.active {
    background: #ffffff;
    color: var(--pink-text);
    box-shadow: 0 1px 3px rgba(255, 143, 171, 0.18);
  }
  .chat-tabs .tab:hover { color: var(--pink-text); }
  .chat-body {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .chat-sidebar {
    width: 72px;
    background: var(--pink-100);
    padding: 12px 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: center;
    border-right: 1px solid #fce0e9;
    flex-shrink: 0;
  }
  .folder-btn {
    width: 60px;
    padding: 8px 0;
    border-radius: 10px;
    text-align: center;
    font-size: 10px;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .folder-btn:hover { background: #ffffff; }
  .folder-btn.active { background: #ffffff; box-shadow: 0 1px 3px rgba(255, 143, 171, 0.2); color: var(--pink-text); }
  .folder-btn .ico { font-size: 18px; }
  .chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #fffafc;
    overflow: hidden;
  }
  .chat-scroll {
    flex: 1;
    padding: 14px 14px 8px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bubble {
    align-self: flex-end;
    max-width: 80%;
    background: var(--pink-200);
    border-radius: 14px 14px 4px 14px;
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text);
    position: relative;
    transition: transform 0.1s;
  }
  .bubble:hover { transform: scale(1.005); }
  .bubble .time {
    display: block;
    font-size: 9px;
    color: var(--text-soft);
    margin-top: 3px;
    text-align: right;
  }
  .bubble .img { margin-top: 6px; border-radius: 8px; overflow: hidden; }
  .bubble.important { background: #ffe5d4; }
  .chat-input-row {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 10px 12px 12px;
    border-top: 1px solid #fce0e9;
    background: var(--pink-100);
  }
  .chat-camera { color: var(--pink-text); font-size: 15px; cursor: pointer; }
  .chat-input {
    flex: 1;
    background: #ffffff;
    border-radius: 16px;
    padding: 7px 12px;
    font-size: 12px;
    color: var(--text);
    border: 1px solid #fef0f5;
  }
  .chat-send {
    background: #fcd0de;
    color: #ffffff;
    border-radius: 12px;
    padding: 6px 14px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .chat-send:hover { background: #f599b3; }
</style>
</head>
<body>
  <div class="chat-widget">
    <div class="chat-topbar">
      <div class="chat-tabs">
        <span class="tab active">📁 ALL</span>
        <span class="tab">IDEA</span>
        <span class="tab">TO DO</span>
        <span class="tab">MEMO</span>
        <span class="tab">PROMPT</span>
        <span class="tab">WORK</span>
        <span class="tab">ECT</span>
      </div>
      <span class="win-dots"><span></span><span></span><span></span></span>
    </div>
    <div class="chat-body">
      <div class="chat-sidebar">
        <div class="folder-btn active"><span class="ico">📁</span>IDEA</div>
        <div class="folder-btn"><span class="ico">📌</span>고정</div>
        <div class="folder-btn"><span class="ico">📁</span>TO DO</div>
        <div class="folder-btn"><span class="ico">❤️</span>중요</div>
        <div class="folder-btn"><span class="ico">📁</span>MEMO</div>
        <div class="folder-btn"><span class="ico">📁</span>PROMPT</div>
        <div class="folder-btn"><span class="ico">📁</span>WORK</div>
        <div class="folder-btn"><span class="ico">📁</span>ECT</div>
      </div>
      <div class="chat-main">
        <div class="chat-scroll" id="scroll"></div>
        <div class="chat-input-row">
          <span class="chat-camera">📷</span>
          <input class="chat-input" id="msg" placeholder="memo">
          <button class="chat-send" onclick="send()">SEND</button>
        </div>
      </div>
    </div>
  </div>
<script>
const KEY = 'memoos_chat';
function load(){
  try { return JSON.parse(localStorage.getItem(KEY)) || seed(); }
  catch(e) { return seed(); }
}
function save(arr){ localStorage.setItem(KEY, JSON.stringify(arr)); }
function seed(){
  const now = Date.now();
  return [
    {t:'가계부에서 고정비 영역 빼두기', d: now - 5400000, i:false},
    {t:'고정 메모는 여기에 표시된답니다 ✦✦ 항상 확인할 수 있어요~', d: now - 3600000, i:true},
    {t:'바로바로 추가', d: now - 1800000, i:false},
    {t:'이곳에서 고정 메모를 바로 추가하고 확인할 수 있어요!', d: now - 900000, i:false},
    {t:'미니 메모에서는 아주 빠르게 메모 입력이 가능해요 ><', d: now - 600000, i:false},
    {t:'이미지 추가도 가능합니다 ><~~', d: now - 300000, i:false},
    {t:'iframe 위젯 임베드 오류 해결 프롬프트\n#1. 배포 헤더 확인 (가장 중요)', d: now - 60000, i:false},
  ];
}
function fmtTime(d){
  const dt = new Date(d);
  let h = dt.getHours();
  const m = String(dt.getMinutes()).padStart(2, '0');
  const ampm = h >= 12 ? '오후' : '오전';
  h = h % 12; if (h === 0) h = 12;
  return ampm + ' ' + h + ':' + m;
}
function render(){
  const scroll = document.getElementById('scroll');
  scroll.innerHTML = '';
  load().forEach(it => {
    const el = document.createElement('div');
    el.className = 'bubble' + (it.i ? ' important' : '');
    el.innerHTML = esc(it.t).replace(/\n/g, '<br>') + '<span class="time">' + fmtTime(it.d) + '</span>';
    scroll.appendChild(el);
  });
  scroll.scrollTop = scroll.scrollHeight;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function send(){
  const inp = document.getElementById('msg');
  if(!inp.value.trim()) return;
  const arr = load();
  arr.push({t: inp.value.trim(), d: Date.now(), i: false});
  save(arr);
  inp.value = '';
  render();
}
document.getElementById('msg').addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
render();
</script>
</body>
</html>
