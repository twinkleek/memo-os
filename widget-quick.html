<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEMO OS · Quick Memo</title>
<link rel="stylesheet" href="styles.css">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: transparent;
  }
  .quick-card {
    width: 100%;
    max-width: 290px;
    background: linear-gradient(165deg, #fffafc, #fef0f5);
    border: 1px solid #fce0e9;
    border-radius: 18px;
    padding: 14px 14px 12px;
    box-shadow: 0 6px 16px rgba(255, 143, 171, 0.14);
  }
  .quick-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .quick-header .title {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 13px;
    color: var(--pink-text);
    font-weight: 600;
  }
  .quick-form {
    display: flex;
    gap: 6px;
    align-items: center;
    background: #ffffff;
    border-radius: 14px;
    padding: 4px 4px 4px 12px;
    border: 1px solid #fef0f5;
  }
  .quick-form input {
    flex: 1;
    font-size: 12px;
    padding: 8px 0;
    color: var(--text);
    background: transparent;
  }
  .quick-form button {
    background: #fcd0de;
    color: #ffffff;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 8px 14px;
    border-radius: 10px;
    transition: background 0.15s;
  }
  .quick-form button:hover { background: #f599b3; }
  .toast {
    text-align: center;
    margin-top: 8px;
    font-size: 9px;
    color: var(--pink-text);
    font-style: italic;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="quick-card">
    <div class="quick-header">
      <span class="title">⚡ quick memo</span>
      <span class="win-dots"><span></span><span></span><span></span></span>
    </div>
    <form class="quick-form" onsubmit="event.preventDefault(); send();">
      <input id="inp" placeholder="떠오른 생각을 바로 던져넣어..." autocomplete="off">
      <button type="submit">SEND</button>
    </form>
    <div class="toast" id="toast">기록 완료 ♡</div>
  </div>
<script>
  const KEY = 'memoos_quick';
  function send(){
    const inp = document.getElementById('inp');
    if(!inp.value.trim()) return;
    const arr = JSON.parse(localStorage.getItem(KEY) || '[]');
    arr.unshift({t: inp.value.trim(), d: new Date().toISOString()});
    localStorage.setItem(KEY, JSON.stringify(arr.slice(0, 100)));
    inp.value = '';
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
  }
</script>
</body>
</html>
