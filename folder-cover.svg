<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="fg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5f8"/>
      <stop offset="60%" stop-color="#fcd0de"/>
      <stop offset="100%" stop-color="#f9b5c8"/>
    </linearGradient>
    <radialGradient id="fg2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="280" fill="url(#fg1)"/>
  <rect width="400" height="280" fill="url(#fg2)"/>

  <!-- 큰 하트 -->
  <g transform="translate(200 130)">
    <path d="M0,40 C-50,0 -50,-50 -25,-50 C-10,-50 0,-35 0,-20 C0,-35 10,-50 25,-50 C50,-50 50,0 0,40 Z"
          fill="#ffffff" opacity="0.85"/>
    <path d="M0,30 C-35,0 -35,-35 -18,-35 C-7,-35 0,-25 0,-15 C0,-25 7,-35 18,-35 C35,-35 35,0 0,30 Z"
          fill="#f599b3" opacity="0.4"/>
  </g>

  <!-- 별/도트 -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="80" r="3"/>
    <circle cx="340" cy="60" r="2.5"/>
    <circle cx="60" cy="220" r="2"/>
    <circle cx="350" cy="230" r="3.5"/>
    <circle cx="120" cy="180" r="2"/>
    <circle cx="290" cy="170" r="2.5"/>
