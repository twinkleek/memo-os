<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🫧 SOMLUTION MEMO OS — 위젯 갤러리</title>
<link rel="stylesheet" href="styles.css">
<style>
  body {
    background: linear-gradient(180deg, #fff5f8 0%, #ffe4ec 100%);
    min-height: 100vh;
    padding: 40px 20px;
  }
  .container {
    max-width: 1100px;
    margin: 0 auto;
  }
  .title-bar {
    background: var(--pink-soft);
    border-radius: 12px;
    padding: 8px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--pink-text);
    font-size: 11px;
    margin-bottom: 28px;
  }
  h1 {
    font-size: 30px;
    color: var(--text);
    margin-bottom: 24px;
    letter-spacing: -0.5px;
  }
  h1 .icon {
    background: white;
    padding: 4px 8px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(255, 143, 171, 0.2);
    margin-right: 8px;
    display: inline-block;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1.2fr 1.8fr;
    gap: 22px;
    align-items: start;
  }
  .col-label {
    font-style: italic;
    text-align: center;
    color: var(--pink-text);
    font-size: 13px;
    margin-bottom: 14px;
    position: relative;
  }
  .col-label::before, .col-label::after {
    content: "";
    display: inline-block;
    width: 28px;
    height: 6px;
    background: var(--pink-soft);
    border-radius: 4px;
    vertical-align: middle;
    margin: 0 8px;
  }
  iframe {
    width: 100%;
    border: none;
    background: transparent;
  }
  iframe.clock { height: 220px; }
  iframe.chat { height: 580px; }
  iframe.pinned { height: 620px; }
  iframe.quick { height: 130px; }
  .row {
    margin-bottom: 24px;
  }
  .links {
    margin-top: 40px;
    padding: 20px;
    background: white;
    border-radius: 16px;
    border: 1px solid var(--border);
  }
  .links h2 {
    font-size: 16px;
    color: var(--pink-accent);
    margin-bottom: 12px;
  }
  .links a {
    color: var(--pink-text);
    text-decoration: none;
    display: inline-block;
    background: var(--pink-soft);
    padding: 8px 14px;
    border-radius: 10px;
    margin: 4px 6px 4px 0;
    font-size: 13px;
  }
  .links a:hover {
    background: var(--pink-mid);
    color: white;
  }
  .footnote {
    margin-top: 24px;
    text-align: center;
    color: var(--text-light);
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="container">
  <h1><span class="icon">🧾</span>[SOMLUTION] MEMO OS</h1>

  <div class="title-bar">
    <span>♥ <strong>SOM'S MEMO OS</strong></span>
    <span id="topbar-time">5월 26일 (화) 오후 1:00</span>
  </div>

  <div class="grid">
    <div>
      <div class="col-label">today is</div>
      <iframe class="clock" src="widget-clock.html"></iframe>
      <div style="height:24px"></div>
      <div class="col-label">quick memo</div>
      <iframe class="quick" src="widget-quick.html"></iframe>
    </div>
    <div>
      <div class="col-label">pinned memo</div>
      <iframe class="pinned" src="widget-pinned.html"></iframe>
    </div>
    <div>
      <div class="col-label">full widget</div>
      <iframe class="chat" src="widget-chat.html"></iframe>
    </div>
  </div>

  <div class="links">
    <h2>🔗 위젯 URL (노션 임베드용)</h2>
    <a href="widget-clock.html" target="_blank">🕐 Clock</a>
    <a href="widget-chat.html" target="_blank">💬 Chat</a>
    <a href="widget-pinned.html" target="_blank">📌 Pinned</a>
    <a href="widget-quick.html" target="_blank">⚡ Quick</a>
    <p style="margin-top:14px;color:var(--text-light);font-size:12px">
      이 URL을 노션에서 <code>/embed</code> 후 붙여넣으면 위젯이 임베드됩니다.<br>
      배포 + 노션 DB 동기화는 README.md 참고.
    </p>
  </div>

  <div class="footnote">
    ♥ 원본: <a href="https://www.postype.com/@somnote/post/22343409" style="color:var(--pink-accent)">SOMLUTION MEMO OS @ Postype</a>
  </div>
</div>
<script>
  function tick() {
    const d = new Date();
    const DOW = ['일','월','화','수','목','금','토'];
    const h = d.getHours();
    const m = d.getMinutes();
    const ampm = h >= 12 ? '오후' : '오전';
    const hh = ((h % 12) || 12);
    document.getElementById('topbar-time').textContent =
      `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]}) ${ampm} ${hh}:${String(m).padStart(2,'0')}`;
  }
  tick();
  setInterval(tick, 30000);
</script>
</body>
</html>
