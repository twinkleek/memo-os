<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEMO OS · Pinned</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    padding: 8px;
    background: transparent;
    display: flex;
    justify-content: center;
  }
  .pin-card {
    width: 100%;
    max-width: 320px;
    height: calc(100vh - 16px);
    max-height: 700px;
    background: linear-gradient(180deg, #fffafc, #fef0f5);
    border: 1px solid #fce0e9;
    border-radius: 18px;
    padding: 12px 12px 8px;
    box-shadow: 0 6px 18px rgba(255, 143, 171, 0.14);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .pin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 4px 6px;
    border-bottom: 1px dashed #fce0e9;
  }
  .pin-title {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 13px;
    color: var(--pink-text);
    font-weight: 600;
  }
  .pin-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 2px;
  }
  .pin-card-item {
    background: var(--pink-100);
    border-radius: 10px;
    padding: 9px 11px;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--text);
    position: relative;
    transition: transform 0.15s;
    cursor: default;
  }
  .pin-card-item:hover {
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(255, 143, 171, 0.15);
  }
  .pin-card-item .h {
    display: block;
    color: #fcd0de;
    font-size: 9px;
    margin-bottom: 3px;
    letter-spacing: 0.08em;
  }
  .pin-card-item .x {
    position: absolute;
    top: 4px;
    right: 6px;
    color: var(--text-soft);
    font-size: 11px;
    opacity: 0;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .pin-card-item:hover .x { opacity: 1; }
  .pin-card-item .x:hover { color: #f599b3; }

  .c-pink { background: #fde2ec; }
  .c-peach { background: #ffe5d4; }
  .c-mint { background: #d8efdc; }
  .c-cream { background: #fff5d6; }
  .c-sky { background: #d8e6f7; }
  .c-lilac { background: #e5dbf2; }

  .pin-add {
    margin: 4px 2px 0;
    background: transparent;
    border: 1px dashed #fcd0de;
    border-radius: 10px;
    padding: 8px;
    color: var(--pink-text);
    font-size: 11px;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s;
  }
  .pin-add:hover { background: #fef0f5; }
</style>
</head>
<body>
  <div class="pin-card">
    <div class="pin-header">
      <span class="pin-title">📌 pinned memo</span>
      <span class="win-dots"><span></span><span></span><span></span></span>
    </div>
    <div class="pin-list" id="list"></div>
    <button class="pin-add" onclick="add()">+ new pinned</button>
  </div>
<script>
const KEY = 'memoos_pinned';
const COLORS = ['c-pink','c-peach','c-mint','c-cream','c-sky','c-lilac'];
function load(){
  try { return JSON.parse(localStorage.getItem(KEY)) || seed(); }
  catch(e) { return seed(); }
}
function save(arr){ localStorage.setItem(KEY, JSON.stringify(arr)); }
function seed(){
  return [
    {t:'고정 메모는 여기에 적어보아요 ㅎㅎ', c:'c-peach'},
    {t:'☐ 왓차 구독 해제', c:'c-mint'},
    {t:'☐ 임대차계약서 사본 준비', c:'c-pink'},
    {t:'☐ 유튜브에 롤링크레딧 링크 추가', c:'c-cream'},
    {t:'☐ 세금 신고', c:'c-peach'},
    {t:'<크티> ctee.kr/place/somlution', c:'c-sky'},
    {t:'threads.com/@solutionsam_', c:'c-mint'},
    {t:'가계부에서 고정비 영역 빼두기', c:'c-lilac'},
  ];
}
function render(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  load().forEach((it, idx) => {
    const el = document.createElement('div');
    el.className = 'pin-card-item ' + (it.c || COLORS[idx % COLORS.length]);
    el.innerHTML = '<span class="h">♡</span>' + esc(it.t) + '<span class="x" title="삭제">×</span>';
    el.querySelector('.x').onclick = (e) => {
      e.stopPropagation();
      const arr = load(); arr.splice(idx, 1); save(arr); render();
    };
    list.appendChild(el);
  });
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function add(){
  const t = prompt('새 고정 메모:'); if(!t) return;
  const arr = load();
  arr.unshift({t, c: COLORS[Math.floor(Math.random()*COLORS.length)]});
  save(arr); render();
}
render();
</script>
</body>
</html>
