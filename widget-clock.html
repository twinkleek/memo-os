<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEMO OS · Clock</title>
<style>
  :root {
    --pink-bg-1: #fff5f8;
    --pink-bg-2: #fde2ec;
    --pink-text: #dc7494;
    --pink-soft: #fce0e9;
    --pink-mid: #fcd0de;
    --pink-light: #fef0f5;
    --display-pattern: #f0e8eb;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    font-family: -apple-system, 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
  }
  .clock-card {
    width: 100%;
    max-width: 250px;
    background: linear-gradient(170deg, #fff5f8 0%, #fde2ec 100%);
    border-radius: 22px;
    padding: 14px 16px 14px;
    border: 1px solid #fce0e9;
    box-shadow:
      0 8px 20px rgba(252, 208, 222, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.8);
    position: relative;
  }
  .clock-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    padding: 0 2px;
  }
  .clock-date {
    font-size: 10px;
    color: #d28aa3;
    font-weight: 600;
    letter-spacing: 0.5px;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
  }
  .clock-date .heart {
    color: #ec9bb2;
    font-size: 11px;
  }
  .clock-dots {
    font-size: 12px;
    color: #d8b8c4;
    letter-spacing: 1px;
    line-height: 1;
  }
  .clock-display-wrap {
    position: relative;
  }
  .clock-display {
    background: #ffffff;
    background-image:
      radial-gradient(circle at center, #ede4e7 0.7px, transparent 0.8px);
    background-size: 7px 7px;
    background-position: 3px 3px;
    border-radius: 12px;
    padding: 16px 14px 14px;
    box-shadow:
      inset 0 1px 2px rgba(0, 0, 0, 0.04),
      inset 0 -1px 0 rgba(252, 208, 222, 0.15);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 3px;
    white-space: nowrap;
  }
  .clock-time {
    font-family: 'Courier New', monospace;
    font-weight: 800;
    font-size: clamp(38px, 11.5vw, 58px);
    line-height: 0.9;
    color: #2a2a2a;
    letter-spacing: -2px;
  }
  .clock-ampm {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    font-style: italic;
    font-size: clamp(14px, 4vw, 20px);
    color: #2a2a2a;
    padding-bottom: 5px;
    letter-spacing: 0;
  }
  .clock-side-btn {
    position: absolute;
    right: -8px;
    top: 50%;
    transform: translateY(-50%);
    width: 11px;
    height: 32px;
    background: linear-gradient(90deg, #f9b5c8, #fcd0de);
    border-radius: 3px;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.5),
      0 1px 2px rgba(220, 116, 148, 0.2);
  }
  .clock-footer {
    text-align: center;
    margin-top: 10px;
    font-size: 9px;
    color: #d8b8c4;
    letter-spacing: 0.15em;
  }
</style>
</head>
<body>
  <div class="clock-card">
    <div class="clock-header">
      <span class="clock-date"><span class="heart">♥</span> <span id="date">5.24 SUN</span></span>
      <span class="clock-dots">···</span>
    </div>
    <div class="clock-display-wrap">
      <div class="clock-display">
        <span class="clock-time" id="time">05:08</span><span class="clock-ampm" id="ampm">PM</span>
      </div>
      <div class="clock-side-btn"></div>
    </div>
    <div class="clock-footer">⋆⁺₊ ☾ ₊⁺⋆</div>
  </div>
<script>
  function pad(n){return String(n).padStart(2,'0');}
  const DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  function tick(){
    const d = new Date();
    let h = d.getHours();
    const m = pad(d.getMinutes());
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    document.getElementById('time').textContent = pad(h) + ':' + m;
    document.getElementById('ampm').textContent = ampm;
    document.getElementById('date').textContent =
      (d.getMonth()+1) + '.' + d.getDate() + ' ' + DOW[d.getDay()];
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
