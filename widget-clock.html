<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEMO OS · Clock</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    background: transparent;
  }
  .clock-card {
    width: 100%;
    max-width: 320px;
    aspect-ratio: 1.8 / 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: linear-gradient(165deg, #fffafc 0%, #fef0f5 60%, #fde2ec 100%);
    border-radius: 22px;
    padding: 16px 18px 18px;
    box-shadow:
      0 10px 24px rgba(255, 143, 171, 0.18),
      inset 0 1px 0 #ffffff;
    position: relative;
    border: 1px solid #fce0e9;
  }
  .clock-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-family: var(--font-serif);
  }
  .clock-header .date {
    font-size: 11px;
    font-weight: 600;
    font-style: italic;
    color: var(--pink-text);
    letter-spacing: 0.05em;
  }
  .clock-header .dots {
    letter-spacing: 2px;
    color: var(--pink-300);
    font-size: 10px;
  }
  .clock-display {
    background: #ffffff;
    background-image:
      linear-gradient(90deg, transparent 49.7%, rgba(252, 208, 222, 0.28) 49.7%, rgba(252, 208, 222, 0.28) 50.3%, transparent 50.3%),
      linear-gradient(0deg, transparent 49.7%, rgba(252, 208, 222, 0.28) 49.7%, rgba(252, 208, 222, 0.28) 50.3%, transparent 50.3%);
    background-size: 10px 10px;
    border-radius: 14px;
    padding: 16px 14px;
    box-shadow: inset 0 2px 5px rgba(252, 208, 222, 0.4);
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
  }
  .clock-display {
    flex: 1;
    min-height: 0;
  }
  .clock-time {
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-weight: 800;
    font-size: clamp(36px, 13vw, 64px);
    line-height: 1;
    color: #3a2a32;
    letter-spacing: -2px;
  }
  .clock-ampm {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: clamp(11px, 3.5vw, 18px);
    color: #3a2a32;
    padding-bottom: 6px;
    letter-spacing: 1px;
  }
  .clock-side {
    position: absolute;
    right: -7px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 38px;
    background: #fcd0de;
    border-radius: 4px;
    box-shadow: inset -1px 0 0 rgba(0,0,0,0.05);
  }
  .clock-bottom {
    text-align: center;
    margin-top: 10px;
    font-size: 9px;
    font-style: italic;
    color: var(--text-soft);
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
  <div class="clock-card">
    <div class="clock-header">
      <span class="date">♥ <span id="date">5.26 TUE</span></span>
      <span class="dots">···</span>
    </div>
    <div class="clock-display">
      <span class="clock-time" id="time">10:45</span><span class="clock-ampm" id="ampm">AM</span>
      <div class="clock-side"></div>
    </div>
    <div class="clock-bottom">⋆⁺₊ ⋆ ☾ ⋆⁺₊ ⋆</div>
  </div>
<script>
  function pad(n){return String(n).padStart(2,'0');}
  const DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  function tick(){
    const d = new Date();
    let h = d.getHours();
    const m = pad(d.getMinutes());
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    document.getElementById('time').textContent = pad(h) + ':' + m;
    document.getElementById('ampm').textContent = ampm;
    document.getElementById('date').textContent =
      (d.getMonth()+1) + '.' + d.getDate() + ' ' + DOW[d.getDay()];
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
