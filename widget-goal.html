<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEMO OS · Today's Goal</title>
<style>
  :root {
    --pink-text: #dc7494;
    --pink-soft: #fce0e9;
    --pink-light: #fef0f5;
    --pink-mid: #fcd0de;
    --pink-deep: #f599b3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 10px;
    font-family: -apple-system, 'Pretendard', system-ui, sans-serif;
  }
  .goal-card {
    width: 100%;
    max-width: 270px;
    background: #ffffff;
    border: 1.5px solid var(--pink-mid);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(252, 208, 222, 0.25);
  }
  .goal-topbar {
    background: var(--pink-light);
    padding: 7px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--pink-soft);
  }
  .goal-titlebox {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .goal-icon {
    background: #ffffff;
    border: 1px solid var(--pink-mid);
    border-radius: 5px;
    padding: 2px 5px;
    font-size: 12px;
    line-height: 1;
  }
  .goal-title {
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 13px;
    color: #5a4a52;
    font-weight: 600;
  }
  .goal-tools {
    display: flex;
    gap: 4px;
    color: var(--pink-mid);
    font-size: 11px;
  }
  .goal-body {
    background: #fffafc;
    padding: 12px 14px;
    min-height: 100px;
    font-size: 11.5px;
    line-height: 1.5;
    color: #5a4a52;
    cursor: text;
    outline: none;
  }
  .goal-body:empty::before {
    content: '오늘의 목표를 적어보세요...';
    color: #d8b8c4;
    font-style: italic;
  }
  .save-msg {
    text-align: center;
    font-size: 9px;
    color: var(--pink-text);
    padding: 4px 0 6px;
    font-style: italic;
    opacity: 0;
    transition: opacity 0.3s;
    background: #fffafc;
  }
  .save-msg.show { opacity: 1; }
</style>
</head>
<body>
  <div class="goal-card">
    <div class="goal-topbar">
      <div class="goal-titlebox">
        <span class="goal-icon">🌸</span>
        <span class="goal-title">today's goal</span>
      </div>
      <div class="goal-tools">✎ ⇆</div>
    </div>
    <div class="goal-body" id="goal" contenteditable="true" oninput="saveGoal()"></div>
    <div class="save-msg" id="msg">저장됨 ♥</div>
  </div>
<script>
const KEY = 'memoos_goal';
const goal = document.getElementById('goal');
const msg = document.getElementById('msg');
goal.innerHTML = localStorage.getItem(KEY) || '';
let to;
function saveGoal(){
  clearTimeout(to);
  to = setTimeout(() => {
    localStorage.setItem(KEY, goal.innerHTML);
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 1200);
  }, 400);
}
</script>
</body>
</html>
