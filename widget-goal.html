<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEMO OS · Today's Goal</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 8px;
    background: transparent;
  }
  .goal-card {
    width: 100%;
    max-width: 320px;
    background: #ffffff;
    border-radius: 18px;
    border: 1px solid #fce0e9;
    box-shadow: 0 6px 18px rgba(255, 143, 171, 0.12);
    overflow: hidden;
  }
  .goal-header {
    background: var(--pink-100);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #fce0e9;
  }
  .goal-title {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 13px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .goal-icon-box {
    background: #ffffff;
    border-radius: 6px;
    padding: 2px 6px;
    font-size: 13px;
  }
  .goal-tools { color: #fcd0de; font-size: 12px; }
  .goal-body {
    background: #fffafc;
    padding: 14px;
    min-height: 130px;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--text);
    cursor: text;
    outline: none;
  }
  .goal-body:empty::before {
    content: '오늘의 목표를 적어보세요 ⋆⁺₊ ⋆';
    color: var(--text-soft);
    font-style: italic;
  }
  .save-msg {
    text-align: center;
    font-size: 9px;
    color: var(--pink-text);
    padding: 6px 0 8px;
    font-style: italic;
    opacity: 0;
    transition: opacity 0.3s;
    background: #fffafc;
  }
  .save-msg.show { opacity: 1; }
</style>
</head>
<body>
  <div class="goal-card">
    <div class="goal-header">
      <span class="goal-title">
        <span class="goal-icon-box">🌸</span>
        <span>today's goal</span>
      </span>
      <span class="goal-tools">✎</span>
    </div>
    <div class="goal-body" id="goal" contenteditable="true" oninput="saveGoal()"></div>
    <div class="save-msg" id="msg">저장됨 ♥</div>
  </div>
<script>
const KEY = 'memoos_goal';
const goal = document.getElementById('goal');
const msg = document.getElementById('msg');
goal.innerHTML = localStorage.getItem(KEY) || '';
let to;
function saveGoal(){
  clearTimeout(to);
  to = setTimeout(() => {
    localStorage.setItem(KEY, goal.innerHTML);
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 1200);
  }, 400);
}
</script>
</body>
</html>
